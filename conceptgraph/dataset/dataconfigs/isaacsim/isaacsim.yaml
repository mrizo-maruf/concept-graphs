dataset_name: 'isaacsim'
camera_params:
  image_height: 720
  image_width: 1280
  # IsaacSim Replicator default at 1280x720 with ~70 deg horizontal FOV.
  # Override per scene if your camera prim uses different intrinsics.
  fx: 913.0
  fy: 913.0
  cx: 640.0
  cy: 360.0
  # IsaacSim 16-bit depth is stored in millimeters (depth_in_meters * 1000).
  png_depth_scale: 1000.0
  crop_edge: 0
